name: Build CI Image

on:
  push:
    branches: [main]
    paths: [Dockerfile, .dockerignore, .github/workflows/build-ci.yml]
  pull_request:
    branches: [main]
    paths: [Dockerfile, .dockerignore, .github/workflows/build-ci.yml]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ci:latest" >> "$GITHUB_ENV"
          echo "AZURE_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ci:azure-v1" >> "$GITHUB_ENV"
          echo "SHA_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ci:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ${{ env.IMAGE }}
            ${{ env.AZURE_IMAGE }}
            ${{ env.SHA_IMAGE }}
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm "$IMAGE" bash -ec '
            php --version
            php-cgi --version
            composer --version
            symfony version
            pg_isready --version
            node --version
            test "$(pnpm --version)" = "12.16.1"
            command -v bash groupadd tar gzip
            php -r '\''foreach (["pdo_pgsql", "intl", "mbstring", "zip"] as $ext) { if (!extension_loaded($ext)) { exit(1); } }'\''
          '

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE"
          docker push "$AZURE_IMAGE"
          docker push "$SHA_IMAGE"
